services:
  fitpal-backend:
    build:
      context: ./FitPal-flask
    container_name: fitpal-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: 9903
      FLASK_DEBUG: "false"
      DB_HOST: host.docker.internal
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fit
      JWT_SECRET: fitpal-jwt-secret-please-change-in-production-2026-very-long
      JWT_EXPIRATION_MS: 86400000
      MINIO_ENDPOINT: http://host.docker.internal:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_USER_AVATAR_BUCKET: fitpal-user-avatar
      MINIO_COMMUNITY_POST_BUCKET: fitpal-community-post
      MINIO_USER_AVATAR_PREFIX: avatars
      MINIO_COMMUNITY_POST_PREFIX: posts
      EXPORT_PATH: /app/exports
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "9030:9903"
    volumes:
      - ./data/exports:/app/exports
    networks:
      - default

  fitpal-frontend:
    build:
      context: ./FitPal-frontend
    container_name: fitpal-frontend
    restart: unless-stopped
    depends_on:
      - fitpal-backend
    ports:
      - "9031:80"
    networks:
      - default

  fitpal-uniapp-h5:
    build:
      context: ./FitPal-uniapp
      dockerfile: Dockerfile.h5
    container_name: fitpal-uniapp-h5
    restart: unless-stopped
    depends_on:
      - fitpal-backend
    ports:
      - "9032:8080"
    networks:
      - default

networks:
  default:
    driver: bridge
